<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skill 工作台</title>
<style>
:root { --bg:#f6f7f9; --card:#fff; --border:#e3e6ea; --text:#1c2430; --muted:#6b7686; --accent:#2563eb; --ok:#16a34a; --warn:#d97706; --bad:#dc2626; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:"Segoe UI","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); font-size:14px; }
header { background:var(--card); border-bottom:1px solid var(--border); padding:12px 20px; display:flex; align-items:center; gap:16px; position:sticky; top:0; z-index:5; }
header h1 { font-size:17px; font-weight:600; }
header .stats { color:var(--muted); font-size:12.5px; }
header button { margin-left:auto; }
button { background:var(--accent); color:#fff; border:none; border-radius:6px; padding:6px 14px; font-size:13px; cursor:pointer; }
button.sec { background:#eef2f7; color:var(--text); border:1px solid var(--border); }
button:disabled { opacity:.5; cursor:default; }
main { display:flex; height:calc(100vh - 57px); }
#left { width:52%; min-width:520px; overflow:auto; padding:14px; border-right:1px solid var(--border); }
#right { flex:1; overflow:auto; padding:14px; display:flex; flex-direction:column; }
#detail { flex:1; display:flex; flex-direction:column; min-height:0; }
.toolbar { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; align-items:center; }
.toolbar input[type=text] { padding:6px 10px; border:1px solid var(--border); border-radius:6px; flex:1; min-width:160px; }
.toolbar select { padding:6px; border:1px solid var(--border); border-radius:6px; }
.gcard { background:var(--card); border:1px solid var(--border); border-radius:8px; margin-bottom:8px; overflow:hidden; }
.ghead { padding:9px 12px; display:flex; align-items:center; gap:10px; cursor:pointer; }
.ghead:hover { background:#fafbfc; }
.gname { font-weight:600; }
.gdesc { color:var(--muted); font-size:12px; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.badge { font-size:11px; padding:2px 8px; border-radius:10px; white-space:nowrap; }
.badge.identical { background:#e7f6ec; color:var(--ok); }
.badge.diverged { background:#fdeaea; color:var(--bad); }
.badge.shared { background:#e8effd; color:var(--accent); }
.badge.single { background:#f0f1f3; color:var(--muted); }
.gbody { border-top:1px solid var(--border); display:none; padding:8px 12px; }
.gcard.open .gbody { display:block; }
.copyrow { display:flex; align-items:center; gap:10px; padding:6px 4px; border-bottom:1px dashed #eef0f2; font-size:13px; }
.copyrow:last-child { border-bottom:none; }
.tooltag { background:#eef2f7; border-radius:4px; padding:1px 7px; font-size:12px; min-width:118px; text-align:center; }
.layertag { font-size:11px; color:var(--muted); }
.badge.warn-plugin { background:#fef3e2; color:var(--warn); }
.badge.dead { background:#fdeaea; color:var(--bad); }
.path { color:var(--muted); font-size:11.5px; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; direction:rtl; text-align:left; }
.rowbtns button { padding:3px 10px; font-size:12px; margin-left:6px; }
h2 { font-size:15px; margin-bottom:10px; }
textarea.editor { width:100%; flex:1; min-height:420px; font-family:Consolas,monospace; font-size:13px; border:1px solid var(--border); border-radius:8px; padding:10px; resize:vertical; background:var(--card); }
.meta { color:var(--muted); font-size:12px; margin:6px 0; }
.notice { background:#fef3e2; color:#92400e; font-size:12.5px; padding:7px 10px; border-radius:6px; margin-bottom:8px; }
dialog { border:1px solid var(--border); border-radius:10px; padding:20px; min-width:380px; }
dialog::backdrop { background:rgba(0,0,0,.25); }
dialog label { display:block; margin:10px 0 4px; font-size:13px; }
dialog input, dialog select { width:100%; padding:7px 9px; border:1px solid var(--border); border-radius:6px; }
.dlgbtns { margin-top:16px; text-align:right; }
.muted { color:var(--muted); }
.toast { position:fixed; bottom:18px; right:18px; background:#111827; color:#fff; padding:9px 16px; border-radius:8px; font-size:13px; opacity:0; transition:.25s; z-index:50; }
.toast.show { opacity:.95; }
</style>
</head>
<body>
<header>
  <h1>Skill 工作台</h1>
  <span class="stats" id="stats"></span>
  <button class="sec" onclick="rescan()">重新扫描</button>
  <button onclick="openCreate()">+ 新建 skill</button>
</header>
<main>
  <div id="left">
    <div class="toolbar">
      <input type="text" id="q" placeholder="搜索 skill 名 / 描述 / 工具…" oninput="render()">
      <select id="filter" onchange="render()">
        <option value="all">全部组</option>
        <option value="diverged">⚠ 仅看分歧</option>
        <option value="multi">多副本</option>
        <option value="shared">共享链接</option>
        <option value="single">单副本</option>
      </select>
    </div>
    <div id="grouplist"></div>
  </div>
  <div id="right">
    <div id="detail" class="muted">← 点击左侧 skill 查看与编辑</div>
  </div>
</main>

<dialog id="createDlg">
  <h2>新建 skill</h2>
  <label>所属工具</label>
  <select id="c_tool"></select>
  <label>skill 名（小写字母/数字/连字符）</label>
  <input id="c_name" placeholder="my-new-skill">
  <label>一句话描述</label>
  <input id="c_desc" placeholder="这个 skill 做什么、何时触发">
  <div class="dlgbtns">
    <button class="sec" onclick="createDlg.close()">取消</button>
    <button onclick="doCreate()">创建</button>
  </div>
</dialog>
<div class="toast" id="toast"></div>

<script>
let REG = null, curGroup = null, curFile = null;
const $ = id => document.getElementById(id);
function toast(s) { const t = $('toast'); t.textContent = s; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2200); }
async function api(path, opts) { const r = await fetch(path, opts); const j = await r.json(); if (!r.ok) throw new Error(j.error || r.status); return j; }

async function load() {
  REG = await api('/api/registry');
  const layers = {};
  REG.copies.forEach(c => layers[c.layer] = (layers[c.layer] || 0) + 1);
  $('stats').textContent = `${REG.totalGroups} 组 · ${REG.totalCopies} 副本（用户 ${layers.user || 0} · 共享 ${layers.shared || 0} · 插件 ${layers.plugin || 0} · 运行时 ${layers.runtime || 0}）`;
  const tools = [...new Set(REG.copies.filter(c => c.layer === 'user').map(c => c.tool))].sort();
  $('c_tool').innerHTML = tools.map(t => `<option>${t}</option>`).join('');
  render();
}

function render() {
  const q = $('q').value.toLowerCase(), f = $('filter').value;
  const list = REG.groups.filter(g => {
    if (f === 'diverged' && g.syncState !== 'diverged') return false;
    if (f === 'multi' && g.copies.length < 2) return false;
    if (f === 'shared' && g.syncState !== 'shared-only') return false;
    if (f === 'single' && g.copies.length !== 1) return false;
    if (!q) return true;
    if (g.canonical.toLowerCase().includes(q)) return true;
    return g.copies.some(id => { const c = REG.copies.find(x => x.id === id); return c && (c.tool.toLowerCase().includes(q) || (c.frontmatter.description || '').toLowerCase().includes(q)); });
  });
  $('grouplist').innerHTML = list.map(g => {
    const copies = g.copies.map(id => REG.copies.find(c => c.id === id));
    const desc = (copies.find(c => c.frontmatter.description) || copies[0]).frontmatter.description || '';
    let badge;
    if (g.syncState === 'diverged') badge = `<span class="badge diverged">分歧</span>`;
    else if (g.syncState === 'identical') badge = `<span class="badge identical">一致 ×${copies.length}</span>`;
    else if (g.syncState === 'shared-only') badge = `<span class="badge shared">共享真身 ×${copies.length}</span>`;
    else badge = `<span class="badge single">单副本</span>`;
    return `<div class="gcard" data-g="${g.canonical}">
      <div class="ghead" onclick="toggleGroup('${g.canonical}')">
        <span class="gname">${g.canonical}</span><span class="gdesc">${desc}</span>${badge}
      </div>
      <div class="gbody" id="body-${g.canonical}">${copies.map(copyRow).join('')}</div>
    </div>`;
  }).join('') || '<p class="muted">无匹配项</p>';
}

function copyRow(c) {
  let tags = `<span class="tooltag">${c.tool}</span><span class="layertag">${c.layer}</span>`;
  if (c.link) {
    tags += c.link.masterLive ? `<span class="badge shared">链接</span>` : `<span class="badge dead">断链</span>`;
  } else if (c.layer === 'plugin') {
    tags += `<span class="badge warn-plugin">插件更新即失效</span>`;
  } else if (c.layer === 'runtime') {
    tags += `<span class="badge single">运行时</span>`;
  }
  const p = c.link ? c.link.resolved : c.dir;
  const editable = !c.link || c.link.masterLive;
  return `<div class="copyrow">${tags}
    <span class="path" title="${p}">${p}</span>
    <span class="rowbtns">
      ${editable ? `<button class="sec" onclick="editCopy('${c.canonical}','${encodeURIComponent(c.dir)}','${c.id}')">编辑</button>` : ''}
      ${(!c.link && c.layer !== 'runtime') ? `<button class="sec" onclick="delCopy('${c.id}')">删除</button>` : ''}
    </span>
  </div>`;
}

function toggleGroup(name) { document.querySelector(`[data-g="${name}"]`).classList.toggle('open'); }

async function editCopy(canon, encDir, id) {
  curGroup = canon;
  const dir = decodeURIComponent(encDir);
  const reg = await api('/api/registry');
  const c = reg.copies.find(x => x.id === id);
  const realDir = c.link ? c.link.resolved : c.dir;
  const r = await api('/api/group/' + canon);
  const fm = c.frontmatter || {};
  const pluginWarn = c.layer === 'plugin' ? `<div class="notice">⚠ 此副本位于插件缓存，插件更新时编辑会被覆盖。</div>` : '';
  $('detail').innerHTML = `${pluginWarn}
    <h2>${canon} <span class="muted" style="font-weight:400;font-size:13px">· ${c.tool} / ${c.layer}</span></h2>
    <div class="meta">${fm.description ? fm.description : ''}<br>路径：<code>${realDir}</code>${c.link ? '<br>(经链接编辑，实际写入真身)' : ''}</div>
    <textarea class="editor" id="ed" spellcheck="false"></textarea>
    <div style="margin-top:8px;display:flex;gap:8px">
      <button onclick="saveFile()">保存到原位</button>
      <button class="sec" onclick="loadFile()">重读</button>
      ${r.group.syncState === 'diverged' ? `<button onclick="doSync('${canon}')">以最新同步全组</button>` : ''}
    </div>`;
  await loadFile();
  // 默认打开 SKILL.md
  async function loadFile() {
    const f = await api('/api/file?path=' + encodeURIComponent(realDir + '/SKILL.md'));
    curFile = realDir + '/SKILL.md';
    $('ed').value = f.content;
  }
  window.loadFile = loadFile;
  window.saveFile = async () => {
    await api('/api/file', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: curFile, content: $('ed').value }) });
    toast('已保存并重扫'); await load();
  };
}

async function doSync(canon) {
  const r = await api('/api/sync', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ canonical: canon }) });
  toast('同步完成'); console.log(r.log); await load();
}

async function delCopy(id) {
  if (!confirm('确认删除该副本？内容会先移入工作台回收站（data/trash），不直接销毁。')) return;
  await api('/api/delete', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id }) });
  toast('已删除（回收站可找回）'); $('detail').innerHTML = '<div class="muted">已删除</div>'; await load();
}

function openCreate() { $('createDlg').showModal(); }
async function doCreate() {
  try {
    const r = await api('/api/create', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tool: $('c_tool').value, name: $('c_name').value.trim(), description: $('c_desc').value.trim() }) });
    $('createDlg').close(); toast('已创建: ' + r.dir); await load();
    $('q').value = $('c_name').value.trim(); render();
  } catch (e) { toast('创建失败: ' + e.message); }
}

async function rescan() { toast('重扫中…'); await api('/api/rescan', { method: 'POST' }); await load(); toast('完成'); }
load();
</script>
</body>
</html>
