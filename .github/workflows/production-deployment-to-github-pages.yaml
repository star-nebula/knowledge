name: 构建并部署到 Github Pages

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'

env:
  STORE_PATH: ''

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Ubuntu 构建和推送
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 签出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: 安装 Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 安装思源黑体
        run: |
          mkdir -p ~/.local/share/fonts
          cp .vitepress/fonts/source-han-sans.ttf ~/.local/share/fonts/source-han-sans.ttf

      - name: 构建（GitHub Pages，base=/knowledge/）
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm docs:build

      - name: 推送到 gh-pages 分支
        id: deployment
        timeout-minutes: 10
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: .vitepress/dist

      # 以下两步是 EdgeOne 部署。EdgeOne 站点挂在域名根路径，需要 SITE_BASE=/ 重新构建一次，
      # 不能复用上面 base=/knowledge/ 的产物（否则所有站内链接都会带 /knowledge/ 前缀而 404）。
      # 未配置 EDGEONE_TOKEN 时自动跳过，保证 GitHub Pages 链路不受影响。
      - name: 构建（EdgeOne，base=/）
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          SITE_BASE: /
        run: pnpm docs:build

      - name: 部署到 EdgeOne
        env:
          EDGEONE_TOKEN: ${{ secrets.EDGEONE_TOKEN }}
          PAGES_SOURCE: skills
        run: |
          if [ -z "$EDGEONE_TOKEN" ]; then
            echo "::warning::未配置 EDGEONE_TOKEN，跳过 EdgeOne 部署（GitHub Pages 已正常发布）"
            exit 0
          fi
          npx --yes edgeone@latest makers deploy .vitepress/dist \
            -n star-nebula-knowledge \
            -t "$EDGEONE_TOKEN" \
            --json
